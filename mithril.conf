# ==========================================
# Workspace Rules
# ==========================================

# set the default values for a specific workspace
# -1 means all monitors
# name is only read by external programs, such as bars and pagers

# 		  num  name  layout	        gappx  mfact  nmaster
# ws-rule = { 1,   1,    master-stack,  10,    0.55,  1 }

# ==========================================
#  Keybinds
# ==========================================

# You need to set all the binds you are going to use
# If you set just one bind, that's all you are going to get

# Available commands
# spawn			execute a shell command
# quit			0 quits 1 restarts
# close			closes the selected window
# togglegaps		toggle the gaps between tiled windows
# maximize		maximize window
# minimize    		minimize window
# fullscreen		toggle fullscreen
# togglesticky		makes the window visible on all workspaces
# togglefloating	makes the window tiled/floating
# focus			switch focus
# swaptiled		swap tiled windows
# focusmon		focus another monitor
# sendtomon		send window to another monitor
# view			switch workspaces
# sendtows		send window to another workspace
# incnmaster		increase/decrease the number of masters
# incmfact		increase/decrease the area of the master windows
# setlayout		sets the layout for the current workspace
# move			move window with the keyboard
# resize			resize window with the keyboard

#	    Modifiers	   XKey	    Command		Argument
bind = { super,        w,         spawn,          firefox }
bind = { super|shift,  w,         spawn,          firefoxprofile }
bind = { super,        v,         spawn,          dmenurecord }
bind = { super,        comma,     focusmon,       -1 }
bind = { super,        period,    focusmon,       1 }
bind = { super|shift,  comma,     sendtomon,      -1 }
bind = { super|shift,  period,    sendtomon,      1 }
bind = { super,        t,         setlayout,      master-stack }
bind = { super|shift,  t,         setlayout,      monocle }
bind = { super|shift,  f,         setlayout,      floating }
bind = { super,        h,         incmfact,       -0.05 }
bind = { super,        l,         incmfact,       0.05 }
bind = { super,        o,         incnmaster,     1 }
bind = { super|shift,  o,         incnmaster,     -1 }
bind = { super,        q,         close, 	     0 }
bind = { super|shift,  q,         quit,           0 }
bind = { super,        a,         togglegaps,     0 }
bind = { super,        m,         maximize, 		0 }
bind = { super|shift,  m,         minimize, 		0 }
bind = { super,        f,         fullscreen,  	0 }
bind = { super,        j,         focus,     	1 }
bind = { super,        k,         focus,     	-1 }
bind = { super|shift,  j,         swaptiled,      1 }
bind = { super|shift,  k,         swaptiled,      -1 }
bind = { super,        Return,    spawn,          st }
bind = { super,        d,         spawn,          dmenu_run }
bind = { none,         Print,     spawn,          maimpick }
bind = { super,        Tab,       spawn,          sws -a }
bind = { super|shift,  BackSpace, quit,           1 }
bind = { super,        space,     togglesticky,   0 }
bind = { super|shift,  space,     togglefloating, 0 }
bind = { super,        BackSpace, spawn,          sysact }
bind = { super|shift,  equal,     spawn,          brillo -A 10 }
bind = { super|shift,  minus,     spawn,          brillo -U 10 }

bind = { super,        Left,      move,   left  }
bind = { super|shift,  Left,      resize, left  }
bind = { super,        Right,     move,   right }
bind = { super|shift,  Right,     resize, right }
bind = { super,        Up,        move,   up    }
bind = { super|shift,  Up,        resize, up    }
bind = { super,        Down,      move,   down  }
bind = { super|shift,  Down,      resize, down  }

bind = { super,        1,         view,           1 }
bind = { super|shift,  1,         sendtows,       1 }
bind = { super,        2,         view,           2 }
bind = { super|shift,  2,         sendtows,       2 }
bind = { super,        3,         view,           3 }
bind = { super|shift,  3,         sendtows,       3 }
bind = { super,        4,         view,           4 }
bind = { super|shift,  4,         sendtows,       4 }
bind = { super,        5,         view,           5 }
bind = { super|shift,  5,         sendtows,       5 }
bind = { super,        6,         view,           6 }
bind = { super|shift,  6,         sendtows,       6 }
bind = { super,        7,         view,           7 }
bind = { super|shift,  7,         sendtows,       7 }
bind = { super,        8,         view,           8 }
bind = { super|shift,  8,         sendtows,       8 }
bind = { super,        9,         view,           9 }
bind = { super|shift,  9,         sendtows,       9 }

bind = { super, F1,    spawn, /bin/sh -c "wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"}
bind = { super, equal, spawn, /bin/sh -c "wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+"}
bind = { super, F3,    spawn, /bin/sh -c "wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+"}
bind = { super, minus, spawn, /bin/sh -c "wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-"}
